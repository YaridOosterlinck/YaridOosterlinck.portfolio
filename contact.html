<!DOCTYPE html>
<html lang="nl-BE">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex min-h-screen flex-col">

<header class="border-b border-white/10 bg-(color:--kleur-1)">
<div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-3 sm:px-6 md:flex-row md:items-center md:justify-between">
<a href="portfolio.html" class="flex items-center gap-3 rounded-md text-lg font-bold tracking-tight text-white hover">
<img src="Images/LogoYarid.png" alt="" width="443" height="443" class="size-10 rounded-md">Yarid Oosterlinck</a>
<nav aria-label="Hoofdmenu">
<ul class="flex flex-wrap gap-2">
<li>
<a href="index.html" aria-current="page" class="block rounded-md border border-white/20 px-4 py-3 text-center font-medium text-slate-200 ">Home</a>
</li>
<li>
<a href="portfolio.html" class="block rounded-md border border-white/20 px-4 py-3 text-center font-medium text-slate-200">Portfolio</a>
</li>
<li>
<a href="contact.html" class="block rounded-md border border-white/20 px-4 py-3 text-center font-medium text-blue-400">Contact</a>
</li>
</ul>
</nav>
</div>
</header>
<div class="pagina grid grid-cols-1 flex-1 gap-6 py-8 lg:grid-cols-[minmax(0,1fr)_var(--breedte-aside)]">
<main id="inhoud">
<h1 class="label">Contact</h1>

<form name="contact" method="POST" action="/bedankt.html" data-netlify="true" netlify-honeypot="bot-field" class="mt-4 flex max-w-2xl flex-col gap-5">
  <!-- Verplicht voor Netlify Forms -->
  <input type="hidden" name="form-name" value="contact">
  <!-- Honeypot tegen spam: bots vullen dit in, mensen zien het niet -->
  <p class="hidden">
    <label>Niet invullen: <input name="bot-field"></label>
  </p>

  <div class="flex flex-col gap-1">
    <label for="naam" class="font-medium text-slate-200">Naam</label>
    <input type="text" id="naam" name="naam" required autocomplete="name"
      class="rounded-lg border border-white/20 bg-white/5 px-4 py-3 text-slate-100 placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400">
  </div>

  <div class="flex flex-col gap-1">
    <label for="email" class="font-medium text-slate-200">E-mailadres</label>
    <input type="email" id="email" name="email" required autocomplete="email"
      class="rounded-lg border border-white/20 bg-white/5 px-4 py-3 text-slate-100 placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400">
  </div>

  <div class="flex flex-col gap-1">
    <label for="bericht" class="font-medium text-slate-200">Bericht</label>
    <textarea id="bericht" name="bericht" rows="6" required
      class="rounded-lg border border-white/20 bg-white/5 px-4 py-3 text-slate-100 placeholder:text-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400"></textarea>
  </div>

  <div>
    <button type="submit"
      class="inline-flex items-center gap-2 rounded-lg bg-blue-700 px-5 py-3 font-medium text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-400">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
      </svg>
      Verstuur bericht
    </button>
  </div>
</form>

<div class="mt-8 flex flex-wrap items-center gap-6">
<a href="mailto:yaridoosterlinck@outlook.com" class="inline-flex items-center gap-2 rounded-lg border border-white/20 px-4 py-2 text-slate-200 hover:border-blue-400 hover:text-blue-400">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
<rect x="3" y="5" width="18" height="14" rx="2" />
<path d="m3 7 9 6 9-6" />
</svg>
Stuur me een mail
</a>

<p class="inline-flex items-center gap-2 zacht">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
<circle cx="12" cy="10" r="3"/>
</svg>
Antwerpen, Merksem
</p>
</div>
</main>

<aside aria-label="aside" class="rounded-lg bg-(color:--kleur-2) p-4">
<p class="text-xs font-semibold uppercase tracking-wider text-(color:--kleur-3)">Student</p>
<p class="mt-1 text-sm leading-relaxed text-slate-300">Systeem- en Netwerkbeheer aan Hogeschool AP.</p>
<ul class="mt-4 flex gap-3">
<li><a href="mailto:yaridoosterlinck@outlook.com" class="inline-flex size-11 items-center justify-center rounded-full border border-white/20 text-slate-200 hover:border-(color:--kleur-3) hover:bg-(color:--kleur-2) hover:text-(color:--kleur-3) focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(color:--kleur-3)">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
<span class="sr-only">Stuur me een e-mail</span>
</a></li>
</ul>
</aside>

</div>
<footer class="border-t border-white/10 bg-(color:--kleur-2)">
<div class="mx-auto flex max-w-6xl flex-col gap-1 px-4 py-6 text-sm text-slate-300 sm:flex-row sm:items-center sm:justify-between sm:px-6">
<p>&copy; 2026 Yarid Oosterlinck Student Systeem- en Netwerkbeheer, Hogeschool AP</p>
<a href="mailto:yaridoosterlinck@outlook.com" class="rounded-md hover:text-(color:--kleur-3) focus-visible:outline-(color:--kleur-3)">yaridoosterlinck@outlook.com</a>
</div>
</footer>
</body>
</html>
